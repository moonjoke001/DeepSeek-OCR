        }
        
        // 简单的 Markdown 渲染函数（将 Markdown 文本转换为 HTML）
        function renderMarkdownToHtml(markdown) {
            if (!markdown) return '';
            
            let html = markdown;
            
            // 转义 HTML 特殊字符（但保留我们要处理的 Markdown 语法）
            html = html.replace(/&/g, '&amp;')
                       .replace(/</g, '&lt;')
                       .replace(/>/g, '&gt;');
            
            // 处理标题 (# ## ### 等)
            html = html.replace(/^### (.+)$/gm, '<h3>$1</h3>');
            html = html.replace(/^## (.+)$/gm, '<h2>$1</h2>');
            html = html.replace(/^# (.+)$/gm, '<h1>$1</h1>');
            
            // 处理粗体 **text** 或 __text__
            html = html.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
            html = html.replace(/__(.+?)__/g, '<strong>$1</strong>');
            
            // 处理斜体 *text* 或 _text_
            html = html.replace(/\*([^*]+)\*/g, '<em>$1</em>');
            html = html.replace(/_([^_]+)_/g, '<em>$1</em>');
            
            // 处理行内代码 `code`
            html = html.replace(/`([^`]+)`/g, '<code>$1</code>');
            
            // 处理水平线 --- 或 ***
            html = html.replace(/^(-{3,}|\*{3,})$/gm, '<hr>');
            
            // 处理有序列表（中文数字格式：一、二、三、等）
            html = html.replace(/^([一二三四五六七八九十]+)、(.+)$/gm, '<p class="list-item"><strong>$1、</strong>$2</p>');
            
            // 处理有序列表（数字格式：1. 2. 等）
            html = html.replace(/^(\d+)\.\s+(.+)$/gm, '<p class="list-item"><strong>$1.</strong> $2</p>');
            
            // 处理无序列表 - 或 *
            html = html.replace(/^[-*]\s+(.+)$/gm, '<li>$1</li>');
            
            // 处理引用 >
            html = html.replace(/^&gt;\s*(.+)$/gm, '<blockquote>$1</blockquote>');
            
            // 处理段落（连续的非空行）
            // 先将连续换行转为段落分隔
            html = html.replace(/\n\n+/g, '</p><p>');
            
            // 处理单个换行（在段落内）
            html = html.replace(/\n/g, '<br>');
            
            // 包装在段落中
            if (!html.startsWith('<h') && !html.startsWith('<p') && !html.startsWith('<ul') && !html.startsWith('<ol')) {
                html = '<p>' + html + '</p>';
            }
            
            // 清理多余的空段落
            html = html.replace(/<p>\s*<\/p>/g, '');
            html = html.replace(/<p><br><\/p>/g, '');
            
            return html;
        }
        
        // 检测内容是否包含 Markdown 格式
        function hasMarkdownFormat(content) {
            if (!content) return false;
            // 检测常见的 Markdown 标记
            return /^#+ /m.test(content) ||           // 标题
                   /\*\*.+\*\*/m.test(content) ||     // 粗体
                   /^[-*]\s+/m.test(content) ||       // 无序列表
                   /^\d+\.\s+/m.test(content) ||      // 有序列表
                   /^[一二三四五六七八九十]+、/m.test(content);  // 中文序号
        }
        
        // 显示结果内容（根据模式决定是否渲染 Markdown）
        function displayResultContent(content, container) {
            // 只有主模式 markdown 才渲染，自定义模式下的 custom_markdown 显示原始源码
            const shouldRenderMarkdown = (currentPrompt === 'markdown') && hasMarkdownFormat(content);
            
            if (shouldRenderMarkdown) {
                container.innerHTML = renderMarkdownToHtml(content);
                container.classList.add('markdown-rendered');
            } else {
                container.textContent = content;
                container.classList.remove('markdown-rendered');
            }
        }
        
        // 将带坐标的 OCR 结果转换为 Markdown 表格或提取 Markdown 内容
        // preserveCoordinates: 是否保留原始坐标格式（用于 custom_coord 子模式）
        function convertToMarkdown(rawContent, preserveCoordinates = false) {
            // 如果需要保留坐标，直接返回原始内容
            if (preserveCoordinates) {
                return rawContent;
            }
            
            const hasCoordinates = /\[\[\d+,\s*\d+,\s*\d+,\s*\d+\]\]/.test(rawContent);
            
            if (!hasCoordinates) {
                return rawContent;
            }
            
            // 检测是否为"文档转 Markdown"格式
            // 格式特征: 行首是 title[[...]] 或 text[[...]]，后面跟着实际内容
            // 例如: title[[363, 42, 636, 140]]\n# 标题内容
            const docMarkdownPattern = /^(title|text)\[\[\d+,\s*\d+,\s*\d+,\s*\d+\]\]/m;
            if (docMarkdownPattern.test(rawContent)) {
                return extractDocumentMarkdown(rawContent);
            }
            
            // 检测是否为"图片 OCR (带坐标)"格式
            // 格式特征: 文字[[坐标]] - 文字在前，坐标在后
            // 例如: 国务院办公厅关于2026年[[368, 49, 633, 83]]
            const coordOcrPattern = /^[^\[\]]+\[\[\d+,\s*\d+,\s*\d+,\s*\d+\]\]/m;
            if (coordOcrPattern.test(rawContent)) {
                return extractCoordOcrText(rawContent);
            }
            
            const tableData = parseCoordinateOCR(rawContent);
            if (!tableData || tableData.rows.length === 0) {
                return rawContent;
            }
            
            // 生成 Markdown 表格
            let markdown = '';
            const colCount = tableData.colCount || tableData.rows[0].length;
            
            tableData.rows.forEach((row, rowIdx) => {
                const cells = row.map(c => c.text || '');
                markdown += '| ' + cells.join(' | ') + ' |\n';
                
                // 第一行后添加分隔行
                if (rowIdx === 0) {
                    markdown += '| ' + cells.map(() => '---').join(' | ') + ' |\n';
                }
            });
            
            return markdown;
        }
        
        // 从"文档转 Markdown"格式中提取纯 Markdown 内容
        // 输入格式: title[[x,y,x,y]]\n# 标题\ntext[[x,y,x,y]]\n正文
        function extractDocumentMarkdown(rawContent) {
            const lines = rawContent.split('\n');
            const markdownLines = [];
            
            for (let i = 0; i < lines.length; i++) {
                let line = lines[i];
                // 移除行首的类型标签（title[[...]] 或 text[[...]]）
                line = line.replace(/^(title|text)\[\[\d+,\s*\d+,\s*\d+,\s*\d+\]\]\s*/, '');
                // 去除尾部空格
                line = line.replace(/\s+$/, '');
                // 只保留非空行
                if (line) {
                    markdownLines.push(line);
                }
            }
            
            return markdownLines.join('\n').trim();
        }
        
        // 从"图片 OCR (带坐标)"格式中提取纯文本
        // 输入格式: 文字[[x,y,x,y]]
        function extractCoordOcrText(rawContent) {
            const lines = rawContent.split('\n');
            const textLines = [];
            
            for (const line of lines) {
                // 移除坐标部分，只保留文字
                // 格式: 文字[[x,y,x,y]] -> 文字
                const text = line.replace(/\[\[\d+,\s*\d+,\s*\d+,\s*\d+\]\]/g, '').trim();
                if (text) {
                    textLines.push(text);
                }
            }
            
            return textLines.join('\n');
        }
        
        // 应用表头颜色（跳过 sit-table）
        function applyHeaderColor(container, color) {
            const headers = container.querySelectorAll('th');
            headers.forEach(th => {
                // 跳过 sit-table 中的表头，保持其白色背景
                if (th.closest('.sit-table')) {
                    return;
                }
                th.style.background = color;
                th.style.borderColor = color;
            });
        }
        
        // 解析带坐标的 OCR 结果，重建表格结构（v9 - 智能表单识别）
        function parseCoordinateOCR(text) {
            const lines = text.split('\n').filter(l => l.trim());
            const items = [];
            
            // 解析每行，提取文本和坐标
            for (const line of lines) {
                const match = line.match(/^(.+?)\[\[(\d+),\s*(\d+),\s*(\d+),\s*(\d+)\]\]$/);
                if (match) {
                    const x1 = parseInt(match[2]);
                    const y1 = parseInt(match[3]);
                    const x2 = parseInt(match[4]);
                    const y2 = parseInt(match[5]);
                    items.push({
                        text: match[1].trim(),
                        x1, y1, x2, y2,
                        cx: (x1 + x2) / 2,
                        cy: (y1 + y2) / 2,
                        width: x2 - x1,
                        height: y2 - y1
                    });
                }
            }
            
            if (items.length === 0) return null;
            
            // 1. 按 Y 坐标分组成行
            items.sort((a, b) => a.y1 - b.y1);
            
            const heights = items.map(i => i.height).sort((a, b) => a - b);
            const medianHeight = heights[Math.floor(heights.length / 2)] || 30;
            const rowTolerance = medianHeight * 0.8;
            
            const rowGroups = [];
            let currentRow = [items[0]];
            
            for (let i = 1; i < items.length; i++) {
                const item = items[i];
                const sameRow = currentRow.some(r => Math.abs(item.cy - r.cy) <= rowTolerance);
                
                if (sameRow) {
                    currentRow.push(item);
                } else {
                    currentRow.sort((a, b) => a.x1 - b.x1);
                    rowGroups.push(currentRow);
                    currentRow = [item];
                }
            }
            currentRow.sort((a, b) => a.x1 - b.x1);
            rowGroups.push(currentRow);
            
            // 2. 分析表格类型
            const rowLengths = rowGroups.map(r => r.length);
            const avgRowLength = rowLengths.reduce((a, b) => a + b, 0) / rowLengths.length;
            const rowLengthVariance = rowLengths.reduce((sum, len) => sum + Math.pow(len - avgRowLength, 2), 0) / rowLengths.length;
            const isFormType = rowLengthVariance > 4 || avgRowLength < 5;
            
            // 3. 智能列边界检测
            const colBoundaries = detectSmartColumns(items, rowGroups, isFormType);
            const numCols = colBoundaries.length - 1;
            
            if (numCols < 2) return null;
            
            // 4. 检测表头行数（表单型通常没有表头）
            let headerRowCount = isFormType ? 0 : 1;
            if (!isFormType) {
                for (let i = 0; i < Math.min(3, rowGroups.length); i++) {
                    const row = rowGroups[i];
                    const numericCount = row.filter(item => /^[\d,.\-]+$/.test(item.text)).length;
                    if (numericCount / row.length < 0.5) {
                        headerRowCount = i + 1;
                    } else {
                        break;
                    }
                }
            }
            
            // 5. 构建表格网格
            const allRows = [];
            
            for (let rowIdx = 0; rowIdx < rowGroups.length; rowIdx++) {
                const row = rowGroups[rowIdx];
                const isHeader = rowIdx < headerRowCount;
                const gridRow = Array(numCols).fill(null).map(() => ({ 
                    text: '', rowspan: 1, colspan: 1, skip: false, isHeader: isHeader
                }));
                
                for (const item of row) {
                    // 找到元素所属的列
                    let startCol = findColumnForX(item.x1, colBoundaries);
                    let endCol = findColumnForX(item.x2 - 1, colBoundaries);
                    
                    if (startCol === -1) startCol = 0;
                    if (endCol === -1) endCol = numCols - 1;
                    if (endCol < startCol) endCol = startCol;
                    
                    const colspan = endCol - startCol + 1;
                    
                    const cell = gridRow[startCol];
                    if (!cell.text) {
                        cell.text = item.text;
                        cell.colspan = colspan;
                        for (let c = startCol + 1; c <= endCol && c < numCols; c++) {
                            gridRow[c].skip = true;
                        }
                    } else {
                        cell.text += ' ' + item.text;
                    }
                }
                
                if (gridRow.some(cell => cell.text)) {
                    allRows.push(gridRow);
                }
            }
            
            return { 
                rows: allRows, 
                colCount: numCols, 
                headerRows: headerRowCount,
                isFormType: isFormType
            };
        }
        
        // 找到 X 坐标所属的列索引
        function findColumnForX(x, boundaries) {
            for (let i = 0; i < boundaries.length - 1; i++) {
                if (x >= boundaries[i] && x < boundaries[i + 1]) {
                    return i;
                }
            }
            return -1;
        }
        
        // 智能列边界检测
        function detectSmartColumns(items, rowGroups, isFormType) {
            const allX1 = items.map(i => i.x1);
            const allX2 = items.map(i => i.x2);
            const minX = Math.min(...allX1);
            const maxX = Math.max(...allX2);
            
            // 收集所有左边界位置及其频率
            const x1Freq = new Map();
            for (const item of items) {
                const rounded = Math.round(item.x1 / 15) * 15;
                x1Freq.set(rounded, (x1Freq.get(rounded) || 0) + 1);
            }
            
            // 按频率排序，取出现次数 >= 2 的位置
            let candidates = [...x1Freq.entries()]
                .filter(([x, count]) => count >= 2)
                .sort((a, b) => a[0] - b[0])
                .map(([x]) => x);
            
            // 合并相近的边界（间距 < 60 的合并）
            const merged = [minX - 5];
            for (const x of candidates) {
                const last = merged[merged.length - 1];
                if (x - last >= 60) {
                    merged.push(x);
                }
            }
            merged.push(maxX + 20);
            
            // 如果列数太少，尝试按表格宽度均分
            if (merged.length < 4) {
                const width = maxX - minX;
                const numCols = isFormType ? 4 : 6;
                const colWidth = width / numCols;
                const evenBoundaries = [minX - 5];
                for (let i = 1; i < numCols; i++) {
                    evenBoundaries.push(minX + colWidth * i);
                }
                evenBoundaries.push(maxX + 20);
                return evenBoundaries;
            }
            
            return merged;
        }
        
        // 聚类 X 坐标，找到列边界
        function clusterXPositions(positions, tolerance) {
            if (positions.length === 0) return [0, 1000];
            
            const clusters = [];
            let currentCluster = [positions[0]];
            
            for (let i = 1; i < positions.length; i++) {
                if (positions[i] - positions[i-1] <= tolerance) {
                    currentCluster.push(positions[i]);
                } else {
                    // 取聚类的中间值作为边界
                    clusters.push(currentCluster[0]);
                    currentCluster = [positions[i]];
                }
            }
            clusters.push(currentCluster[0]);
            
            // 添加最后一个边界
            clusters.push(positions[positions.length - 1] + 50);
            
            return clusters;
        }
        
        // 找到坐标对应的边界索引
        function findBoundaryIndex(boundaries, value, tolerance) {
            for (let i = 0; i < boundaries.length; i++) {
                if (Math.abs(boundaries[i] - value) <= tolerance) {
                    return i;
                }
            }
            // 如果没找到精确匹配，找最近的
            let minDist = Infinity, minIdx = 0;
            for (let i = 0; i < boundaries.length; i++) {
                const dist = Math.abs(boundaries[i] - value);
                if (dist < minDist) {
                    minDist = dist;
                    minIdx = i;
                }
            }
            return minIdx;
        }
        
        // 位置聚类：将相近的坐标归为一组
        function clusterPositions(positions, tolerance) {
            if (positions.length === 0) return [];
            
            const clusters = [];
            let currentCluster = [positions[0]];
            
            for (let i = 1; i < positions.length; i++) {
                if (positions[i] - positions[i-1] <= tolerance) {
                    currentCluster.push(positions[i]);
                } else {
                    clusters.push(average(currentCluster));
                    currentCluster = [positions[i]];
                }
            }
            clusters.push(average(currentCluster));
            
            return clusters;
        }
        
        function average(arr) {
            return arr.reduce((a, b) => a + b, 0) / arr.length;
        }
        
        function findNearestIndex(arr, value, maxDist = Infinity) {
            let minDist = Infinity;
            let minIdx = -1;
            for (let i = 0; i < arr.length; i++) {
                const dist = Math.abs(arr[i] - value);
                if (dist < minDist && dist <= maxDist) {
                    minDist = dist;
                    minIdx = i;
                }
            }
            return minIdx;
        }
        
        // 移除坐标标注
        function removeCoordinates(text) {
            return text
                .replace(/\[\[\d+,\s*\d+,\s*\d+,\s*\d+\]\]/g, '')
                .replace(/<box>.*?<\/box>/g, '')
                .replace(/<ref>.*?<\/ref>/g, '')
                .replace(/<\|[^|]+\|>/g, '')
                .trim();
        }
        
        function parseMarkdownTables(markdown) {
            // 检测是否是带坐标的 OCR 结果
            const hasCoordinates = /\[\[\d+,\s*\d+,\s*\d+,\s*\d+\]\]/.test(markdown);
            
            if (hasCoordinates) {
                const tableData = parseCoordinateOCR(markdown);
                if (tableData && tableData.rows.length > 0) {
                    return renderCoordinateTable(tableData);
                }
            }
            
            // 回退到普通解析
            const cleanMarkdown = removeCoordinates(markdown);
            const sections = cleanMarkdown.split(/\n---\n/);
            let html = '';
            
            sections.forEach((section, sectionIdx) => {
                const trimmedSection = section.trim();
                if (!trimmedSection) return;
                
                const fileMatch = trimmedSection.match(/^📄\s*(.+?)(?:\n|$)/);
                if (fileMatch) {
                    html += `<div class="file-section"><div class="file-header">📄 ${escapeHtml(fileMatch[1])}</div>`;
                }
                
                const content = fileMatch ? trimmedSection.substring(fileMatch[0].length) : trimmedSection;
                html += parseSection(content);
                
                if (fileMatch) {
                    html += '</div>';
                }
                
                if (sectionIdx < sections.length - 1) {
                    html += '<hr class="section-divider">';
                }
            });
            
            return html || '<p style="color:var(--gray-600);">未检测到可预览的内容</p>';
        }
        
        // 渲染基于坐标重建的表格（v9 - 智能表单渲染）
        function renderCoordinateTable(tableData) {
            if (!tableData || tableData.rows.length === 0) return '';
            
            const colCount = tableData.colCount || tableData.rows[0].length;
            const headerRows = tableData.headerRows || 0;
            const isFormType = tableData.isFormType || false;
            
            // 根据表格类型选择样式
            const tableClass = isFormType ? 'form-table' : 'coordinate-table';
            let html = `<div class="table-wrapper"><table class="${tableClass}">`;
            
            // 对于表单类型，智能识别标签和值
            if (isFormType) {
                html += '<tbody>';
                for (let rowIdx = 0; rowIdx < tableData.rows.length; rowIdx++) {
                    const row = tableData.rows[rowIdx];
                    html += '<tr>';
                    
                    row.forEach((cell, colIdx) => {
                        if (cell.skip) return;
                        
                        const colspanAttr = cell.colspan > 1 ? ` colspan="${cell.colspan}"` : '';
                        const cellText = escapeHtml(cell.text || '').replace(/\n/g, '<br>');
                        
                        // 智能检测是否是标签单元格
                        const text = cell.text || '';
                        const isLabel = isFormLabel(text);
                        
                        const cellClass = isLabel ? 'form-label' : 'form-value';
                        html += `<td class="${cellClass}"${colspanAttr}>${cellText}</td>`;
                    });
                    
                    html += '</tr>';
                }
                html += '</tbody>';
            } else {
                // 数据表类型：保持原有逻辑
                if (headerRows > 0) {
                    html += '<thead>';
                    for (let rowIdx = 0; rowIdx < headerRows && rowIdx < tableData.rows.length; rowIdx++) {
                        const row = tableData.rows[rowIdx];
                        html += '<tr>';
                        
                        row.forEach((cell, colIdx) => {
                            if (cell.skip) return;
                            
                            const rowspanAttr = cell.rowspan > 1 ? ` rowspan="${cell.rowspan}"` : '';
                            const colspanAttr = cell.colspan > 1 ? ` colspan="${cell.colspan}"` : '';
                            
                            html += `<th${rowspanAttr}${colspanAttr}>${escapeHtml(cell.text || '')}</th>`;
                        });
                        
                        html += '</tr>';
                    }
                    html += '</thead>';
                }
                
                html += '<tbody>';
                const startRow = headerRows > 0 ? headerRows : 0;
                for (let rowIdx = startRow; rowIdx < tableData.rows.length; rowIdx++) {
                    const row = tableData.rows[rowIdx];
                    html += '<tr>';
                    
                    row.forEach((cell, colIdx) => {
                        if (cell.skip) return;
                        
                        const rowspanAttr = cell.rowspan > 1 ? ` rowspan="${cell.rowspan}"` : '';
                        const colspanAttr = cell.colspan > 1 ? ` colspan="${cell.colspan}"` : '';
                        
                        let cellClasses = [];
                        if (/^[\d,.\-]+$/.test((cell.text || '').trim())) {
                            cellClasses.push('numeric');
                        }
                        
                        const classAttr = cellClasses.length > 0 ? ` class="${cellClasses.join(' ')}"` : '';
                        const cellText = escapeHtml(cell.text || '').replace(/\n/g, '<br>');
                        
                        html += `<td${rowspanAttr}${colspanAttr}${classAttr}>${cellText}</td>`;
                    });
                    
                    html += '</tr>';
                }
                html += '</tbody>';
            }
            
            html += '</table></div>';
            return html;
        }
        
        // 判断文本是否是表单标签
        function isFormLabel(text) {
            if (!text) return false;
            
            // 以冒号结尾
            if (/[:：]$/.test(text)) return true;
            
            // 常见表单标签关键词
            const labelKeywords = [
                '姓名', '性别', '年龄', '学历', '专业', '电话', '地址', '日期', '时间',
                '备注', '说明', '籍贯', '民族', '身份', '职务', '职业', '工作', '单位',
                '住址', '邮编', '邮箱', '证号', '编号', '状况', '状态', '关系', '方式',
                '评价', '优势', '劣势', '经历', '教育', '家庭', '成员', '联系', '紧急',
                '期望', '薪资', '岗位', '部门', '原因', '证书', '奖励', '填表', '应聘'
            ];
            
            for (const keyword of labelKeywords) {
                if (text.includes(keyword)) return true;
            }
            
            // 短文本（少于6个字符）且不是纯数字
            if (text.length <= 6 && !/^[\d\.\-\/]+$/.test(text)) return true;
            
            // 包含"口"（复选框）的选项
            if (/^口/.test(text)) return true;
            
            return false;
        }
        
        function parseSection(text) {
            const lines = text.split('\n').map(l => l.trim()).filter(l => l);
            if (lines.length === 0) return '';
            
            // 先尝试检测 Markdown 表格
            let html = '';
            let inTable = false;
            let tableRows = [];
            let hasHeader = false;
            let nonTableContent = [];
            
            for (let i = 0; i < lines.length; i++) {
                const line = lines[i];
                
                // Markdown 表格检测
                const isTableRow = line.includes('|') && (line.match(/\|/g) || []).length >= 2;
                const isSeparator = /^[\|\s\-:]+$/.test(line) && line.includes('-');
                
                if (isTableRow && !isSeparator) {
                    if (nonTableContent.length > 0) {
                        html += renderFormattedText(nonTableContent);
                        nonTableContent = [];
                    }
                    if (!inTable) {
                        inTable = true;
                        tableRows = [];
                        hasHeader = false;
                    }
                    tableRows.push(line);
                } else if (isSeparator && inTable && tableRows.length === 1) {
                    hasHeader = true;
                } else {
                    if (inTable && tableRows.length > 0) {
                        html += renderMarkdownTable(tableRows, hasHeader);
                        tableRows = [];
                        inTable = false;
                        hasHeader = false;
                    }
                    if (line && !isSeparator) {
                        nonTableContent.push(line);
                    }
                }
            }
            
            if (inTable && tableRows.length > 0) {
                html += renderMarkdownTable(tableRows, hasHeader);
            }
            if (nonTableContent.length > 0) {
                html += renderFormattedText(nonTableContent);
            }
            
            // 如果没有 Markdown 表格，尝试智能解析整个内容为表格
            // 注意：检查 '<table' 而不是 '<table>'，因为表格可能有 class 属性
            if (!html.includes('<table') && lines.length >= 2) {
                const smartResult = smartParseTable(lines);
                if (smartResult) {
                    return smartResult;
                }
            }
            
            return html;
        }
        
        // 智能解析 - 尝试将多行数据组织成表格
        function smartParseTable(lines) {
            if (lines.length < 2) return null;
            
            // 分析数据模式：检查是否有重复的键值对结构
            // 例如: "性能指标", "20月累", "11200" 可能是 标题行 + 数据
            
            // 方案1: 检测是否是键值对列表
            const kvPairs = [];
            let isKVFormat = true;
            
            for (const line of lines) {
                // 检查是否包含冒号分隔的键值对
                if (line.includes(':') || line.includes('：')) {
                    const parts = line.split(/[:：]/);
                    if (parts.length >= 2) {
                        kvPairs.push({ key: parts[0].trim(), value: parts.slice(1).join(':').trim() });
                    } else {
                        isKVFormat = false;
                    }
                } else {
                    isKVFormat = false;
                }
            }
            
            if (isKVFormat && kvPairs.length >= 2) {
                return renderKVTable(kvPairs);
            }
            
            // 方案2: 尝试按位置/空格分析列结构
            // 检查每行是否有相似的结构
            const analyzedRows = lines.map(line => {
                // 按多个空格分割
                const cells = line.split(/\s{2,}/).filter(c => c.trim());
                return cells.length > 1 ? cells : [line];
            });
            
            const maxCols = Math.max(...analyzedRows.map(r => r.length));
            const multiColCount = analyzedRows.filter(r => r.length > 1).length;
            
            // 如果超过30%的行有多列，认为是表格
            if (maxCols > 1 && multiColCount >= lines.length * 0.3) {
                return renderAnalyzedTable(analyzedRows, maxCols);
            }
            
            // 方案3: 尝试将连续的数字行和文本行配对
            const numericLines = [];
            const textLines = [];
            
            for (const line of lines) {
                if (/^[\d,.\s%￥$-]+$/.test(line.replace(/\s/g, ''))) {
                    numericLines.push(line);
                } else {
                    textLines.push(line);
                }
            }
            
            // 如果文本行和数字行数量相近，可能是标题+数值的结构
            if (textLines.length > 0 && numericLines.length > 0 && 
                Math.abs(textLines.length - numericLines.length) <= 2) {
                return renderPairedTable(textLines, numericLines);
            }
            
            return null;
        }
        
        // 渲染键值对表格
        function renderKVTable(kvPairs) {
            let html = '<div class="table-wrapper"><table class="kv-table">';
            html += '<tr><th>项目</th><th>值</th></tr>';
            kvPairs.forEach(kv => {
                html += `<tr><td class="kv-key">${escapeHtml(kv.key)}</td><td>${escapeHtml(kv.value)}</td></tr>`;
            });
            html += '</table></div>';
            return html;
        }
        
        // 渲染分析后的表格
        function renderAnalyzedTable(rows, maxCols) {
            let html = '<div class="table-wrapper"><table>';
            rows.forEach((row, idx) => {
                const tag = idx === 0 ? 'th' : 'td';
                html += '<tr>';
                if (row.length === 1 && maxCols > 1) {
                    html += `<td colspan="${maxCols}" class="merged-cell">${escapeHtml(row[0])}</td>`;
                } else {
                    row.forEach(cell => {
                        html += `<${tag}>${escapeHtml(cell)}</${tag}>`;
                    });
                    for (let i = row.length; i < maxCols; i++) {
                        html += `<${tag}></${tag}>`;
                    }
                }
                html += '</tr>';
            });
            html += '</table></div>';
            return html;
        }
        
        // 渲染配对表格（标题行 + 数值行）
        function renderPairedTable(textLines, numericLines) {
            const len = Math.min(textLines.length, numericLines.length);
            let html = '<div class="table-wrapper"><table class="paired-table">';
            html += '<tr><th>项目</th><th>数值</th></tr>';
            for (let i = 0; i < len; i++) {
                html += `<tr><td>${escapeHtml(textLines[i])}</td><td class="numeric">${escapeHtml(numericLines[i])}</td></tr>`;
            }
            // 处理剩余行
            for (let i = len; i < textLines.length; i++) {
                html += `<tr><td colspan="2">${escapeHtml(textLines[i])}</td></tr>`;
            }
            for (let i = len; i < numericLines.length; i++) {
                html += `<tr><td></td><td class="numeric">${escapeHtml(numericLines[i])}</td></tr>`;
            }
            html += '</table></div>';
            return html;
        }
        
        function renderFormattedText(lines) {
            if (!lines || lines.length === 0) return '';
            let html = '<div class="formatted-content">';
            lines.forEach(line => {
                const trimmed = line.trim();
                if (!trimmed) return;
                
                // 检测标题
                if (/^#+\s/.test(trimmed)) {
                    const level = Math.min(trimmed.match(/^#+/)[0].length, 4);
                    const text = trimmed.replace(/^#+\s*/, '');
                    html += `<h${level} class="content-heading">${escapeHtml(text)}</h${level}>`;
                }
                // 检测列表项
                else if (/^[-*•]\s/.test(trimmed)) {
                    html += `<div class="list-item">• ${escapeHtml(trimmed.replace(/^[-*•]\s*/, ''))}</div>`;
                }
                // 检测数字列表
                else if (/^\d+[.)]\s/.test(trimmed)) {
                    const num = trimmed.match(/^\d+/)[0];
                    const text = trimmed.replace(/^\d+[.)]\s*/, '');
                    html += `<div class="list-item">${num}. ${escapeHtml(text)}</div>`;
                }
                // 普通段落
                else {
                    html += `<p class="text-line">${escapeHtml(trimmed)}</p>`;
                }
            });
            html += '</div>';
            return html;
        }
        
        function renderNonTableContent(lines) {
            return renderFormattedText(lines);
        }
        
        function renderMarkdownTable(rows, hasHeader) {
            if (rows.length === 0) return '';
            
            // 解析所有行，保留空单元格
            const parsedRows = rows.map(row => {
                // 去掉首尾的 |，然后按 | 分割
                let trimmed = row.trim();
                if (trimmed.startsWith('|')) trimmed = trimmed.substring(1);
                if (trimmed.endsWith('|')) trimmed = trimmed.slice(0, -1);
                return trimmed.split('|').map(c => c.trim());
            });
            
            // 确定列数（取最大列数）
            const colCount = Math.max(...parsedRows.map(r => r.length));
            
            // 检测是否是 SIT 性能测试表（通过关键词检测）
            const isSITTable = parsedRows.some(row => 
                row.some(cell => /性能指标|并发|响应时间|吞吐率|TPS/.test(cell))
            );
            
            // DEBUG: 输出检测结果
            console.log('[SIT Table Detection]', {
                isSITTable,
                colCount,
                parsedRowsCount: parsedRows.length,
                firstRow: parsedRows[0],
                allCells: parsedRows.flat().slice(0, 20)
            });
            
            if (isSITTable && colCount >= 7) {
                console.log('[SIT Table] Calling renderSITPerformanceTable');
                return renderSITPerformanceTable(parsedRows, colCount);
            }
            
            // 普通表格渲染
            let html = '<div class="table-wrapper"><table>';
            parsedRows.forEach((cells, idx) => {
                const isHeader = hasHeader && idx === 0;
                const tag = isHeader ? 'th' : 'td';
                html += '<tr>';
                for (let i = 0; i < colCount; i++) {
                    const cell = cells[i] || '';
                    html += `<${tag}>${escapeHtml(cell)}</${tag}>`;
                }
                html += '</tr>';
            });
            html += '</table></div>';
            return html;
        }
        
        // 专门渲染 SIT 性能测试表 (v2 - 基于固定列位置)
        function renderSITPerformanceTable(parsedRows, colCount) {
            console.log('[renderSITPerformanceTable] Input:', { parsedRows, colCount });
            
            // 找到第一个数据行（包含"并发"关键词且有多个数字的行）
            // 放宽匹配：支持 "1并发", "5并发 20并发", "100并发 1并发" 等格式
            let firstDataRowIdx = -1;
            for (let i = 0; i < parsedRows.length; i++) {
                const row = parsedRows[i];
                // 匹配包含"X并发"的单元格（可能有多个值用空格分隔）
                const hasConcurrency = row.some(cell => /\d+并发/.test(cell));
                const numericCount = row.filter(cell => /^\d+(\.\d+)?$/.test(cell.trim())).length;
                console.log(`[renderSITPerformanceTable] Row ${i}:`, { 
                    row, 
                    hasConcurrency, 
                    numericCount,
                    cells: row.map(c => ({ cell: c, matchConcurrency: /\d+并发/.test(c) }))
                });
                // 放宽条件：只要有并发关键词且有至少3个数值
                if (hasConcurrency && numericCount >= 3) {
                    firstDataRowIdx = i;
                    break;
                }
            }
            
            console.log('[renderSITPerformanceTable] firstDataRowIdx:', firstDataRowIdx);
            
            if (firstDataRowIdx === -1) {
                // 没找到数据行，返回普通表格
                return renderPlainTable(parsedRows, colCount);
            }
            
            // 构建固定的表头
            let html = '<div class="table-wrapper"><table class="sit-table">';
            
            // 表头第一行
            html += '<thead>';
            html += '<tr class="header-row-1">';
            html += '<th rowspan="2" class="header-cell col-concurrency">并发数</th>';
            html += '<th rowspan="2" class="header-cell col-version">版本</th>';
            html += '<th rowspan="2" class="header-cell col-service">服务接口</th>';
            html += '<th colspan="7" class="header-cell colspan-header">性能指标</th>';
            html += '</tr>';
            
            // 表头第二行
            html += '<tr class="header-row-2">';
            html += '<th class="header-cell col-numeric">请求总数</th>';
            html += '<th class="header-cell col-numeric">平均响应<br>时间(ms)</th>';
            html += '<th class="header-cell col-numeric">90%响应<br>时间(ms)</th>';
            html += '<th class="header-cell col-numeric">95%响应<br>时间(ms)</th>';
            html += '<th class="header-cell col-numeric">99%响应<br>时间(ms)</th>';
            html += '<th class="header-cell col-numeric">吞吐率<br>TPS</th>';
            html += '<th class="header-cell col-numeric">流量<br>KB/S</th>';
            html += '</tr>';
            html += '</thead>';
            
            // 收集数据行并处理服务接口的 rowspan
            const dataRows = [];
            let currentService = '';
            
            for (let i = firstDataRowIdx; i < parsedRows.length; i++) {
                const row = parsedRows[i];
                // 跳过空行或表头行
                if (row.every(cell => !cell)) continue;
                if (row.some(cell => /性能指标|SIT测试|响应时间\(ms\)|吞吐率TPS/.test(cell))) continue;
                
                // 智能检测列位置
                // 并发数: 包含"并发"关键词
                // 版本: 格式为 V + 数字 (如 V2.5)
                // 服务接口: 中文文本（非数字、非版本号）
                // 数值列: 纯数字
                
                let concurrency = '';
                let version = '';
                let service = '';
                const dataValues = [];
                
                // 遍历所有单元格，智能分类
                for (let j = 0; j < row.length; j++) {
                    const cell = (row[j] || '').trim();
                    if (!cell) continue;
                    
                    // 检测并发数（包含"并发"关键词）
                    if (/\d+并发/.test(cell) && !concurrency) {
                        concurrency = cell;
                    }
                    // 检测版本号（V + 数字格式）
                    else if (/^V\d+(\.\d+)?$/i.test(cell) && !version) {
                        version = cell;
                    }
                    // 检测纯数字（数值列）
                    else if (/^[\d,.]+$/.test(cell)) {
                        dataValues.push(cell);
                    }
                    // 检测中文文本（服务接口）
                    else if (/[\u4e00-\u9fa5]/.test(cell) && !/并发/.test(cell)) {
                        if (!service) {
                            service = cell;
                        } else {
                            // 多行服务接口名称合并
                            service += ' ' + cell;
                        }
                    }
                }
                
                // 如果服务接口为空，使用上一个服务接口
                if (!service && currentService) {
                    service = '';  // 标记为需要合并
                } else if (service) {
                    currentService = service;
                }
                
                // 只保留有效数据行（至少有并发数或数值）
                if (concurrency || dataValues.length >= 3) {
                    dataRows.push({
                        concurrency,
                        version,
                        service,
                        dataValues
                    });
                }
            }
            
            // 渲染数据行
            html += '<tbody>';
            for (let i = 0; i < dataRows.length; i++) {
                const { concurrency, version, service, dataValues } = dataRows[i];
                
                html += '<tr>';
                html += `<td class="col-concurrency">${escapeHtml(concurrency)}</td>`;
                html += `<td class="col-version">${escapeHtml(version)}</td>`;
                html += `<td class="col-service">${escapeHtml(service)}</td>`;
                
                // 数值列（确保有7个）
                for (let j = 0; j < 7; j++) {
                    const val = dataValues[j] || '';
                    html += `<td class="col-numeric">${escapeHtml(val)}</td>`;
                }
                
                html += '</tr>';
            }
            html += '</tbody>';
            html += '</table></div>';
            
            return html;
        }
        
        // 普通表格渲染（不做特殊处理）
        function renderPlainTable(parsedRows, colCount) {
            let html = '<div class="table-wrapper"><table>';
            parsedRows.forEach((cells, idx) => {
                const isHeader = idx === 0;
                const tag = isHeader ? 'th' : 'td';
                html += '<tr>';
                for (let i = 0; i < colCount; i++) {
                    const cell = cells[i] || '';
                    html += `<${tag}>${escapeHtml(cell)}</${tag}>`;
                }
                html += '</tr>';
            });
            html += '</table></div>';
            return html;
        }
        
        function renderTable(rows, hasHeader) {
            return renderMarkdownTable(rows, hasHeader);
        }
        
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
        
        function updateProgress(percent) {
            getSession().progress = percent;
            document.getElementById('progressFill').style.width = percent + '%';
            document.getElementById('progressText').textContent = percent + '%';
        }
        
        function getPrompt() {
            if (currentPrompt === 'custom') {
                // 自定义模式：始终使用文本框内容（用户可能修改了）
                return document.getElementById('customPrompt').value || PROMPTS.free;
            }
            return PROMPTS[currentPrompt];
        }

        startBtn.addEventListener('click', async () => {
            const session = getSession();
            if (session.files.length === 0) return;
            
            // 找出待处理的文件索引
            const pendingIndexes = [];
            session.fileStatuses.forEach((status, i) => {
                if (status === 'pending') pendingIndexes.push(i);
            });
            
            // 如果全部完成，点击按钮重新识别所有文件
            if (pendingIndexes.length === 0) {
                // 重置所有文件状态为 pending
                session.fileStatuses = session.files.map(() => 'pending');
                session.allResults = [];
                session.result = null;
                session.currentResultIndex = 0;
                pendingIndexes.push(...session.files.map((_, i) => i));
            }
            
            startBtn.disabled = true;
            session.status = 'processing';
            updateUI();
            
            await processIncremental(pendingIndexes);
        });
        
        async function processIncremental(pendingIndexes) {
            const session = getSession();
            const targetMode = getCurrentModeKey(); // 使用实际的模式键（自定义模式时返回子模式键）
            const totalFiles = session.files.length;
            let newResults = [];
            
            // 重置进度条
            updateProgress(0);
            
            // 状态信息已整合到按钮中，不再单独显示
            
            for (let i = 0; i < pendingIndexes.length; i++) {
                const fileIndex = pendingIndexes[i];
                const file = session.files[fileIndex];
                
                session.fileStatuses[fileIndex] = 'processing';
                if (getCurrentModeKey() === targetMode) updateUI();
                
                try {
                    // 上传文件
                    const formData = new FormData();
                    formData.append('file', file);
                    const uploadRes = await fetch(`${API_BASE}/api/upload`, { method: 'POST', body: formData });
                    const uploadData = await uploadRes.json();
                    
                    if (uploadData.status !== 'success') throw new Error(uploadData.message);
                    
                    // 提取图片主色调（仅第一个文件且尚未提取过）
                    if (i === 0 && !modeSessions[targetMode].headerColor) {
                        try {
                            const colorRes = await fetch(`${API_BASE}/api/extract-color`, {
                                method: 'POST',
                                headers: {'Content-Type': 'application/json'},
                                body: JSON.stringify({ file_path: uploadData.file_path })
                            });
                            const colorData = await colorRes.json();
                            if (colorData.color) {
                                modeSessions[targetMode].headerColor = colorData.color;
                            }
                        } catch (e) {
                            console.log('颜色提取失败，使用默认颜色');
                        }
                    }
                    
                    // 开始 OCR
                    const ocrRes = await fetch(`${API_BASE}/api/ocr`, {
                        method: 'POST',
                        headers: {'Content-Type': 'application/json'},
                        body: JSON.stringify({
                            file_path: uploadData.file_path,
                            file_type: uploadData.file_type,
                            prompt: getPrompt()
                        })
                    });
                    const ocrData = await ocrRes.json();
                    
                    if (ocrData.status !== 'running') throw new Error(ocrData.message);
                    
                    // 等待结果
                    const result = await waitForResult(ocrData.task_id, targetMode, fileIndex, i, pendingIndexes.length);
                    newResults.push({ filename: file.name, content: result });
                    
                    session.fileStatuses[fileIndex] = 'completed';
                    
                } catch (e) {
                    session.fileStatuses[fileIndex] = 'error';
                    console.error(`文件 ${file.name} 处理失败:`, e);
                }
                
                if (getCurrentModeKey() === targetMode) {
                    updateUI();
                }
            }
            
            // 保存所有结果到 allResults
            newResults.forEach(r => {
                modeSessions[targetMode].allResults.push(r);
            });
            
            // 取最后一个处理的结果作为预览/复制内容
            let latestContent = '';
            if (newResults.length > 0) {
                latestContent = newResults[newResults.length - 1].content;
            }
            
            // 判断是否需要保留坐标（custom_coord 子模式）
            const preserveCoords = targetMode === 'custom_coord';
            
            // 将带坐标的结果转换为 Markdown 格式（用于预览和复制）
            const markdownContent = convertToMarkdown(latestContent, preserveCoords);
            
            // 生成时间戳：2512222350 格式
            const getTimestamp = () => {
                const now = new Date();
                const y = String(now.getFullYear()).slice(-2);
                const m = String(now.getMonth() + 1).padStart(2, '0');
                const d = String(now.getDate()).padStart(2, '0');
                const h = String(now.getHours()).padStart(2, '0');
                const min = String(now.getMinutes()).padStart(2, '0');
                return `${y}${m}${d}${h}${min}`;
            };
            
            // 下载 ZIP 包
            const downloadFn = async () => {
                const allResults = modeSessions[targetMode].allResults;
                if (allResults.length === 0) {
                    showStatus('没有可下载的结果', 'error');
                    return;
                }
                
                const zip = new JSZip();
                const timestamp = getTimestamp();
                
                // 添加每个文件的单独结果
                allResults.forEach((r, idx) => {
                    const baseName = r.filename.replace(/\.[^.]+$/, '');
                    const content = convertToMarkdown(r.content, preserveCoords);
                    zip.file(`${baseName}.md`, content);
                });
                
                // 添加合并结果
                if (allResults.length > 1) {
                    const mergedContent = allResults.map(r => 
                        `📄 ${r.filename}\n\n${convertToMarkdown(r.content, preserveCoords)}`
                    ).join('\n\n---\n\n');
                    zip.file('merged.md', mergedContent);
                }
                
                // 生成并下载 ZIP
                const blob = await zip.generateAsync({ type: 'blob' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `dpskocr-${timestamp}.zip`;
                a.click();
                URL.revokeObjectURL(url);
            };
            
            // 保存最新内容用于预览和复制
            modeSessions[targetMode].result = { content: latestContent, downloadFn };
            modeSessions[targetMode].markdownContent = markdownContent;
            modeSessions[targetMode].status = 'completed';
            modeSessions[targetMode].progress = 100;
            // 初始化结果导航索引为最后一个（最新的）
            modeSessions[targetMode].currentResultIndex = modeSessions[targetMode].allResults.length - 1;
            updateModeIndicators();
            
            if (getCurrentModeKey() === targetMode) {
                updateProgress(100);
                updateUI();  // 更新按钮状态为"识别完成"
                document.getElementById('resultCard').style.display = 'block';
                // 默认显示最新文件的 Markdown 格式（根据模式决定是否渲染）
                const resultContainer = document.getElementById('resultContainer');
                displayResultContent(markdownContent, resultContainer);
                showResultButtons(downloadFn);
                // 状态信息已整合到按钮中，不再单独显示
            }
        }
        
        function waitForResult(taskId, targetMode, fileIndex, currentIndex, totalPending) {
            return new Promise((resolve, reject) => {
                const poll = setInterval(async () => {
                    try {
                        const res = await fetch(`${API_BASE}/api/result/${taskId}`);
                        const data = await res.json();
                        
                        if (data.progress && getCurrentModeKey() === targetMode) {
                            const baseProgress = (currentIndex / totalPending) * 100;
                            const fileProgress = (data.progress / 100) * (100 / totalPending);
                            updateProgress(Math.round(baseProgress + fileProgress));
                        }
                        
                        if (data.status === 'success' || data.status === 'finished') {
                            clearInterval(poll);
                            resolve(data.content);
                        } else if (data.status === 'error') {
                            clearInterval(poll);
                            reject(new Error(data.message));
                        }
                    } catch (e) {
                        console.log('轮询错误', e);
                    }
                }, 1500);
            });
        }
    </script>
